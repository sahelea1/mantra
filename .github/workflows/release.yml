name: Release

on:
  push:
    tags:
      - "v*"
  # Allows a maintainer to run the whole pipeline (build + package, no publish
  # target beyond whatever tag is currently checked out) without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

# Binaries are stripped by the release profile in mantra_src/Cargo.toml (strip = true),
# which also applies inside the `cross` container.

jobs:
  build:
    name: build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: mantra-linux-x86_64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: mantra-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: mantra-macos-arm64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: mantra-macos-x86_64
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Cross-compiling Linux aarch64 from an x86_64 runner needs a matching
      # linker/sysroot; `cross` runs the build inside a container that has one
      # (and, as a bonus, targets an older glibc than the ubuntu-latest host
      # would, which is better for binary compatibility on users' machines).
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        working-directory: mantra_src
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package asset
        working-directory: mantra_src
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mantra"
          out="${{ matrix.asset_name }}"
          cp "$bin" "../$out"
          cd ..
          chmod +x "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi
          ls -l "$out" "$out.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
