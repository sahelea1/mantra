name: Release

on:
  push:
    # A version bump on master builds and publishes that version. The release action creates
    # its tag at the tested commit; an existing tag can still run the pipeline directly.
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "mantra_src/Cargo.toml"
  # Allows a maintainer to run the whole pipeline (build + package, no publish
  # target beyond whatever tag is currently checked out) without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

# Binaries are stripped by the release profile in mantra_src/Cargo.toml (strip = true),
# which also applies inside the `cross` container.
#
# Each platform ships two binaries: `mantra` and `bija`, Mantra's built-in agent harness. They
# are one cargo workspace whose default members are both, so the one build below makes both;
# each gets its own asset and checksum, and install.sh puts them side by side.

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test workspace
        working-directory: mantra_src
        run: cargo test --locked --workspace -- --test-threads=1

  build:
    name: build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: mantra-linux-x86_64
            bija_asset_name: bija-linux-x86_64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: mantra-linux-aarch64
            bija_asset_name: bija-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: mantra-macos-arm64
            bija_asset_name: bija-macos-arm64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: mantra-macos-x86_64
            bija_asset_name: bija-macos-x86_64
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      # Cross-compiling Linux aarch64 from an x86_64 runner needs a matching
      # linker/sysroot; `cross` runs the build inside a container that has one
      # (and, as a bonus, targets an older glibc than the ubuntu-latest host
      # would, which is better for binary compatibility on users' machines).
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        working-directory: mantra_src
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package assets
        working-directory: mantra_src
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          package() {
            # package <binary> <asset name>: copy beside the repo root, then checksum it there.
            cp "$dir/$1" "../$2"
            (
              cd ..
              chmod +x "$2"
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$2" > "$2.sha256"
              else
                shasum -a 256 "$2" > "$2.sha256"
              fi
              ls -l "$2" "$2.sha256"
            )
          }
          package mantra "${{ matrix.asset_name }}"
          package bija "${{ matrix.bija_asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.bija_asset_name }}
            ${{ matrix.bija_asset_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout version
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' mantra_src/Cargo.toml | head -n 1)
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: dist/*
