<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mantra</title>
<meta name="description" content="Mantra — your team of coding agents, from any device.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0F1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app">
  <div class="splash">
    <img src="/icons/icon.svg" alt="" width="72" height="72">
    <p>Loading Mantra…</p>
    <noscript><p>Mantra's web UI needs JavaScript.</p></noscript>
  </div>
</div>
<!-- No inline scripts (CSP). config.js is generated by Mantra (local) or shipped by the relay site;
     the ui/*.js files are plain scripts sharing window.Mantra, in dependency order. -->
<script src="/config.js"></script>
<script src="/assets/crypto.js"></script>
<script src="/assets/transport.js"></script>
<script src="/assets/ui/dom.js"></script>
<script src="/assets/ui/fmt.js"></script>
<script src="/assets/ui/store.js"></script>
<script src="/assets/ui/parts.js"></script>
<script src="/assets/ui/agent.js"></script>
<script src="/assets/ui/screens.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
