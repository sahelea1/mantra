[package]
name = "mantra"
version = "0.2.0"
edition = "2021"
description = "Mantra: a terminal UI that runs and orchestrates Codex agents (Solo + Mandala modes)"
license = "MIT"
rust-version = "1.80"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
unicode-width = "0.2"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
debug = 0
