[package]
name = "mantra"
version = "0.5.0"
edition = "2021"
description = "Mantra: a terminal UI that runs and orchestrates Codex agents (Solo + Mandala modes)"
license = "MIT"
rust-version = "1.80"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
unicode-width = "0.2"
dirs = "5"
# Web UI + remote relay (v0.5, `src/web/`). One TLS stack (rustls 0.23 on *ring*, shared by the
# HTTPS listener, the relay client and Web Push), one tungstenite (the one axum's `ws` uses).
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "json", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
rand = "0.8"
subtle = "2"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
debug = 0

# PBKDF2 (310k rounds for the remote key) and AES-GCM are unbearably slow unoptimised; these are
# leaf crates, so optimising them in dev/test builds costs little build time.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
