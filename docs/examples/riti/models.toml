# Mantra model registry.
# Each [[model]] gets a short alias you use in patterns and pickers.
# context_window / auto_compact_percent are passed to Codex per agent.
# Custom providers must speak the OpenAI *Responses* API (Codex requirement).
# Example (Z.ai GLM through a Responses-compatible gateway):
#
# [[provider]]
# id = "zai"
# name = "Z.ai"
# base_url = "https://your-gateway.example/v1"
# env_key = "ZAI_API_KEY"
#
# [[model]]
# alias = "glm"
# provider = "zai"
# model = "glm-5.2"
# default_effort = "high"
# efforts = ["low", "medium", "high", "max"]

[[model]]
alias = "astra"
provider = "openai"
model = "gpt-6-astra"
context_window = 272000
auto_compact_percent = 85
default_effort = "high"
efforts = [
    "low",
    "medium",
    "high",
    "xhigh",
    "max",
    "ultra",
]
note = "most capable — planning & hard problems"

